name: Build DSH Android

on:
  push:
    branches:
      - android
  workflow_dispatch:
    inputs:
      upstream_version:
        description: "@deepseek-ai/dsh version (blank = verified 0.2.0-rc.2)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: dsh-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      NODE_VERSION: 24.18.0
      ANDROID_API: 24
      ANDROID_ABI: arm64-v8a
      ANDROID_NDK_VERSION: 29.0.14206865
      ANDROID_PLATFORM: android-35
      ANDROID_BUILD_TOOLS_VERSION: 35.0.0
      UPSTREAM_VERSION: ${{ inputs.upstream_version || '0.2.0-rc.2' }}
      ANDROID_ESBUILD_VERSION: 0.28.2
    steps:
      - name: Check out Android branch
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org

      # These checks only read repository sources. Keep them before the real
      # Termux/Bash/Node runtime builds so a malformed mobile contract fails
      # quickly without manufacturing placeholder runtime assets.
      - name: Verify Android mobile source fixtures
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/android-mobile-tools.mjs
          node --check scripts/android-settings-ui.js
          node --check scripts/patch-android-settings-ui.mjs
          node --check scripts/test-android-mobile-fixtures.mjs
          node scripts/test-android-mobile-fixtures.mjs

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android SDK and NDK
        shell: bash
        run: |
          set -euo pipefail
          : "${ANDROID_HOME:?setup-android did not provide ANDROID_HOME}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          sdkmanager --sdk_root="$ANDROID_SDK_ROOT" \
            "platforms;${ANDROID_PLATFORM}" \
            "build-tools;${ANDROID_BUILD_TOOLS_VERSION}" \
            "ndk;${ANDROID_NDK_VERSION}"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes cmake ninja-build

      - name: Build the real DSH Termux package
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/build-termux.sh

      - name: Verify Android tool and workspace integration
        shell: bash
        run: |
          set -euo pipefail
          package_dir="$GITHUB_WORKSPACE/build/package"
          node scripts/test-android-mobile-tools.mjs "$package_dir"
          node scripts/test-android-host-events.mjs "$package_dir"
          node scripts/test-android-sandbox.mjs "$package_dir"
          # The Termux package contains an Android ARM64 Koffi binding. Verify
          # real libc publication with an isolated HOST binding of the same version.
          host_fs_dir="$RUNNER_TEMP/dsh-android-filesystem-host"
          koffi_version="$(node -p 'require(process.argv[1]).version' "$package_dir/node_modules/koffi/package.json")"
          npm install --prefix "$host_fs_dir" --ignore-scripts --include=optional --no-audit --no-fund "koffi@$koffi_version"
          node scripts/test-android-filesystem.mjs "$package_dir" "$host_fs_dir/node_modules/koffi"
          node scripts/test-android-workspace.mjs "$package_dir"

      # Restore only final source archives; the Bash script verifies them again.
      - name: Restore verified Bash source archives
        id: bash-source-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            build-bash-android/downloads/bash-5.3.tar.gz
            build-bash-android/downloads/bash_5.3.orig.tar.xz
          key: dsh-bash-5.3-source-v1-${{ hashFiles('scripts/build-android-bash.sh') }}

      # Termux must finish first because it recreates dist/.
      - name: Build the arm64 Bash Android runtime
        shell: bash
        env:
          JOBS: 4
          ANDROID_API: 30
        run: |
          set -euo pipefail
          bash scripts/build-android-bash.sh

      - name: Save verified Bash source archives
        if: ${{ success() && steps.bash-source-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: |
            build-bash-android/downloads/bash-5.3.tar.gz
            build-bash-android/downloads/bash_5.3.orig.tar.xz
          key: ${{ steps.bash-source-cache.outputs.cache-primary-key }}

      # Resolve and build Bash before spending hours compiling Node.
      - name: Build the arm64 Node Android runtime
        shell: bash
        env:
          JOBS: 4
        run: |
          set -euo pipefail
          bash scripts/build-android-node.sh

      - name: Stage the Android runtime bundle
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/stage-android-runtime.sh

      - name: Verify Android workspace picker and Web settings
        shell: bash
        run: |
          set -euo pipefail
          staged_dsh="$GITHUB_WORKSPACE/build/android-runtime/staged/runtime/dsh"
          node scripts/test-android-workspace-picker.mjs "$staged_dsh"
          node scripts/test-android-settings-ui.mjs "$staged_dsh"

      - name: Assemble release APK
        working-directory: android
        run: |
          ./gradlew --no-daemon --stacktrace \
            :app:testDebugUnitTest \
            :app:lintDebug \
            :app:assembleRelease

      # There is no repository signing key. Sign this CI artifact with an
      # ephemeral key so the uploaded APK can be installed for testing.
      - name: Sign and verify release APK
        shell: bash
        run: |
          set -euo pipefail
          unsigned="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          aligned="$RUNNER_TEMP/dsh-android-aligned.apk"
          signed="android/app/build/outputs/apk/release/dsh-android-release.apk"
          keystore="$RUNNER_TEMP/dsh-android-ci.keystore"
          [[ -f "$unsigned" ]] || { echo "missing release APK: $unsigned" >&2; exit 1; }

          keytool -genkeypair -v \
            -keystore "$keystore" \
            -storepass android \
            -keypass android \
            -alias dsh-ci \
            -keyalg RSA \
            -keysize 2048 \
            -validity 1 \
            -dname "CN=DSH Android CI, O=DeepSeek Harness"
          "$ANDROID_HOME/build-tools/${ANDROID_BUILD_TOOLS_VERSION}/zipalign" -f -p 4 "$unsigned" "$aligned"
          "$ANDROID_HOME/build-tools/${ANDROID_BUILD_TOOLS_VERSION}/apksigner" sign \
            --ks "$keystore" \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out "$signed" "$aligned"
          "$ANDROID_HOME/build-tools/${ANDROID_BUILD_TOOLS_VERSION}/apksigner" verify --verbose "$signed"
          sha256sum "$signed" > "$signed.sha256"

      - name: Upload installable APK
        uses: actions/upload-artifact@v6
        with:
          name: dsh-android-${{ github.run_number }}
          path: |
            android/app/build/outputs/apk/release/dsh-android-release.apk
            android/app/build/outputs/apk/release/dsh-android-release.apk.sha256
          if-no-files-found: error
